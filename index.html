<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08090c">
  <meta name="description" content="국방사업단 홍보영상을 콘티 순서대로 씬별 재생합니다.">
  <title>국방사업단 홍보영상 — 씬별 재생</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%2308090c'/%3E%3Crect x='6' y='14' width='20' height='2' fill='%23d6bc84'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&amp;display=swap">
  <link rel="stylesheet" href="css/screen.css">
</head>
<body>
  <a class="skip" href="#stage">선택한 영상으로</a>
  <header class="mast">
    <div class="wrap mast-row">
      <div class="mast-copy">
        <p class="kicker">콘티 v5 · 순서 재생</p>
        <h1>국방사업단 홍보영상 — 씬별 재생</h1>
      </div>
      <div class="mast-actions">
        <button class="btn btn-primary" id="play-all" type="button">전체 재생</button>
        <button class="btn" id="stop-all" type="button">정지</button>
        <p class="stats" id="stats" aria-live="polite"></p>
      </div>
    </div>
  </header>

  <div class="wrap">
    <section class="stage" id="stage" aria-label="선택한 씬">
      <div class="stage-frame">
        <video id="stage-video" controls playsinline preload="metadata" poster=""></video>
      </div>
      <div class="stage-copy">
        <p class="stage-kicker"><span id="stage-id">—</span><span id="stage-part"></span></p>
        <h2 id="stage-desc"></h2>
        <p class="camera" id="stage-camera"></p>
        <label class="ver">버전
          <select id="stage-version"></select>
        </label>
        <button class="btn btn-resume" id="resume" type="button" hidden>이어서 재생</button>
      </div>
    </section>
    <p class="notice" id="notice" role="status"></p>
    <main class="grid" id="grid" aria-label="씬 목록"></main>
    <footer class="colophon">
      <p>국방사업단 홍보영상 씬별 시사. 기본 영상은 각 씬에서 가장 최근 버전이다.</p>
      <p>화면의 로고와 연도, MRO 표기는 후반에 얹는 자리다. 폐기된 F11 모자이크는 넣지 않는다.</p>
    </footer>
  </div>
  <script src="js/player.js"></script>
</body>
</html>
